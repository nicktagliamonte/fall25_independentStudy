# Purpose: Template for docker-compose.yml (generated by start.sh)
# This file is a template - do not edit directly

version: '3.8'

services:
  bootstrap:
    build: .
    container_name: fall25-bootstrap
    hostname: bootstrap
    command: run
      --listen /ip4/0.0.0.0/tcp/4001
      --listen /ip4/0.0.0.0/udp/4002/quic-v1
      --key /app/keys/bootstrap.key
      --store /app/data/bootstrap
      --min-outbound 4
      --control /app/logs/bootstrap.json
      --log /app/logs/bootstrap.log
    volumes:
      - bootstrap-data:/app/data
      - bootstrap-keys:/app/keys
      - bootstrap-logs:/app/logs
    networks:
      node-network:
        ipv4_address: 172.20.0.10
    healthcheck:
      test: ["CMD", "sh", "-c", "test -f /app/logs/bootstrap.json && curl -sf http://$$(jq -r .addr /app/logs/bootstrap.json)/health || exit 1"]
      interval: 5s
      timeout: 3s
      retries: 10
      start_period: 10s

networks:
  node-network:
    driver: bridge
    ipam:
      config:
        - subnet: 172.20.0.0/16
