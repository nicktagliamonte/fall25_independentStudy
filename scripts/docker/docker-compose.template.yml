# Purpose: Template for docker-compose.yml (generated by start.sh)
# This file is a template - do not edit directly

version: '3.8'

services:
  bootstrap:
    build:
      context: .
      dockerfile: Dockerfile
      network: host
    image: fall25_independentstudy-bootstrap:latest
    container_name: fall25-bootstrap
    hostname: bootstrap
    command: run
      --listen /ip4/172.20.0.10/tcp/4001
      --key /app/keys/bootstrap.key
      --store /app/data/bootstrap
      --min-outbound ${TARSUS_MIN_OUTBOUND:-3}
      --max-connections ${TARSUS_MAX_CONNECTIONS:-8}
      --no-default-bootstrap
      --index-shards ${TARSUS_INDEX_SHARDS:-16}
      --disable-bloom-pruning=${TARSUS_DISABLE_BLOOM_PRUNING:-false}
      --control /app/logs/bootstrap.json
      --log /app/logs/bootstrap.log
    volumes:
      - bootstrap-data:/app/data
      - bootstrap-keys:/app/keys
      - bootstrap-logs:/app/logs
    networks:
      node-network:
        ipv4_address: 172.20.0.10
    environment:
      - CLUSTER_NODE_COUNT=${TARSUS_NODE_COUNT:-100}
    healthcheck:
      test: ["CMD", "sh", "-c", "test -f /app/logs/bootstrap.json && curl -sf http://$$(jq -r .addr /app/logs/bootstrap.json)/health || exit 1"]
      interval: 5s
      timeout: 3s
      retries: 10
      start_period: 10s

networks:
  node-network:
    driver: bridge
    ipam:
      config:
        - subnet: 172.20.0.0/16
