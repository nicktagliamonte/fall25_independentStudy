# Purpose: Template for docker-compose.yml (generated by start.sh)
# This file is a template - do not edit directly

version: '3.8'

services:
  bootstrap:
    build: .
    container_name: fall25-bootstrap
    hostname: bootstrap
    command: run
      --listen /ip4/0.0.0.0/tcp/4001
      --listen /ip4/0.0.0.0/udp/4002/quic-v1
      --key /app/keys/bootstrap.key
      --store /app/data/bootstrap
      --min-outbound 4
      --control /app/logs/bootstrap.json
      --log /app/logs/bootstrap.log
    volumes:
      - bootstrap-data:/app/data
      - bootstrap-keys:/app/keys
      - bootstrap-logs:/app/logs
    networks:
      node-network:
        ipv4_address: 172.20.0.10
    healthcheck:
      test: ["CMD", "sh", "-c", "test -f /app/logs/bootstrap.json && curl -sf http://$$(jq -r .addr /app/logs/bootstrap.json)/health || exit 1"]
      interval: 5s
      timeout: 3s
      retries: 10
      start_period: 10s

  node2:
    build: .
    container_name: fall25-node2
    hostname: node2
    command: run
      --listen /ip4/0.0.0.0/tcp/4001
      --listen /ip4/0.0.0.0/udp/4002/quic-v1
      --key /app/keys/node2.key
      --store /app/data/node2
      --min-outbound 4
      --control /app/logs/node2.json
      --log /app/logs/node2.log
    volumes:
      - node2-data:/app/data
      - node2-keys:/app/keys
      - node2-logs:/app/logs
    networks:
      node-network:
        ipv4_address: 172.20.0.11
    depends_on:
      bootstrap:
        condition: service_healthy
    environment:
      - SNG40_SEEDS=/ip4/172.20.0.10/tcp/4001/p2p/12D3KooWHp3texktugupqdqVQNfpwEmUmAsnLvFNTECLPcSYrE2Q
  node3:
    build: .
    container_name: fall25-node3
    hostname: node3
    command: run
      --listen /ip4/0.0.0.0/tcp/4001
      --listen /ip4/0.0.0.0/udp/4002/quic-v1
      --key /app/keys/node3.key
      --store /app/data/node3
      --min-outbound 4
      --control /app/logs/node3.json
      --log /app/logs/node3.log
    volumes:
      - node3-data:/app/data
      - node3-keys:/app/keys
      - node3-logs:/app/logs
    networks:
      node-network:
        ipv4_address: 172.20.0.12
    depends_on:
      bootstrap:
        condition: service_healthy
    environment:
      - SNG40_SEEDS=/ip4/172.20.0.10/tcp/4001/p2p/12D3KooWHp3texktugupqdqVQNfpwEmUmAsnLvFNTECLPcSYrE2Q
  node4:
    build: .
    container_name: fall25-node4
    hostname: node4
    command: run
      --listen /ip4/0.0.0.0/tcp/4001
      --listen /ip4/0.0.0.0/udp/4002/quic-v1
      --key /app/keys/node4.key
      --store /app/data/node4
      --min-outbound 4
      --control /app/logs/node4.json
      --log /app/logs/node4.log
    volumes:
      - node4-data:/app/data
      - node4-keys:/app/keys
      - node4-logs:/app/logs
    networks:
      node-network:
        ipv4_address: 172.20.0.13
    depends_on:
      bootstrap:
        condition: service_healthy
    environment:
      - SNG40_SEEDS=/ip4/172.20.0.10/tcp/4001/p2p/12D3KooWHp3texktugupqdqVQNfpwEmUmAsnLvFNTECLPcSYrE2Q
networks:
  node-network:
    driver: bridge
    ipam:
      config:
        - subnet: 172.20.0.0/16

volumes:
