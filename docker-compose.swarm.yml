# Purpose: Template for docker-compose.swarm.yml (generated by swarm/start.sh)
# Ethereum Swarm/Bee v0.5.8 - node counts 10, 50, 100, 500 for fair comparison with vn-IPFS

version: '3.8'

services:
  swarm-bootstrap:
    build: scripts/docker/swarm
    image: swarm-node:latest
    container_name: swarm-bootstrap
    hostname: swarm-bootstrap
    environment:
      - SWARM_DATA_DIR=/app/data
      - SWARM_HTTP_ADDR=0.0.0.0:8500
      - SWARM_HTTP_PORT=8500
      - SWARM_VERBOSITY=4
      - SWARM_PASSWORD=swarm-test-password
      - SWARM_DEBUG=true
    volumes:
      - swarm-bootstrap-data:/app/data
      - swarm-bootstrap-logs:/app/logs
    networks:
      node-network:
        ipv4_address: 172.20.0.200
    ports:
      - "8500:8500"  # HTTP API port (Swarm v0.5.8 default)
      - "30399:30399"  # P2P port (Swarm v0.5.8 default)
    healthcheck:
      test: ["CMD", "sh", "-c", "curl -sf http://localhost:8500/ || exit 1"]
      interval: 5s
      timeout: 3s
      retries: 10
      start_period: 15s

  swarm-node1:
    build: scripts/docker/swarm
    image: swarm-node:latest
    container_name: swarm-node1
    hostname: swarm-node1
    environment:
      - SWARM_DATA_DIR=/app/data
      - SWARM_HTTP_ADDR=0.0.0.0:8500
      - SWARM_HTTP_PORT=8500
      - SWARM_VERBOSITY=4
      - SWARM_PASSWORD=swarm-test-password
      - SWARM_BOOTNODE=enode://2ae48fd4e8f84f042623d54080c54498067bc88b9c563a4b5f41efcc9caa5fca8a9de97cde04d0da920b1d704e4da82588aaf860edfafd439224772927c68796@172.20.0.200:30399
    volumes:
      - swarm-node1-data:/app/data
      - swarm-node1-logs:/app/logs
    networks:
      node-network:
        ipv4_address: 172.20.0.201
    healthcheck:
      test: ["CMD", "sh", "-c", "curl -sf http://localhost:8500/ || exit 1"]
      interval: 5s
      timeout: 3s
      retries: 10
      start_period: 30s
    depends_on:
      swarm-bootstrap:
        condition: service_healthy
