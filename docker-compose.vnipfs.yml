# Purpose: vn-IPFS multi-node compose (output of scripts/docker/gen_vnipfs_compose.sh)
# vn-IPFS nodes - supports N in {10, 50, 100, 500}

version: '3.8'

services:
  bootstrap:
    build:
      context: .
      dockerfile: Dockerfile
      network: host
    image: fall25_independentstudy-bootstrap:latest
    container_name: fall25-bootstrap
    hostname: bootstrap
    command: run
      --listen /ip4/172.20.0.10/tcp/4001
      --listen /ip4/172.20.0.10/udp/4002/quic-v1
      --key /app/keys/bootstrap.key
      --store /app/data/bootstrap
      --min-outbound 4
      --control /app/logs/bootstrap.json
      --log /app/logs/bootstrap.log
    environment:
      - SNG40_CONTROL_LISTEN=0.0.0.0:9400
    ports:
      - "9400:9400"
    volumes:
      - bootstrap-data:/app/data
      - bootstrap-keys:/app/keys
      - bootstrap-logs:/app/logs
    networks:
      node-network:
        ipv4_address: 172.20.0.10
    healthcheck:
      test: ["CMD", "sh", "-c", "test -f /app/logs/bootstrap.json && curl -sf http://$$(jq -r .addr /app/logs/bootstrap.json)/health || exit 1"]
      interval: 5s
      timeout: 3s
      retries: 10
      start_period: 10s

  node2:
    image: fall25_independentstudy-bootstrap:latest
    container_name: fall25-node2
    hostname: node2
    command: run
      --listen /ip4/172.20.0.11/tcp/4001
      --listen /ip4/172.20.0.11/udp/4002/quic-v1
      --key /app/keys/node2.key
      --store /app/data/node2
      --min-outbound 4
      --control /app/logs/node2.json
      --log /app/logs/node2.log
    volumes:
      - node2-data:/app/data
      - node2-keys:/app/keys
      - node2-logs:/app/logs
    networks:
      node-network:
        ipv4_address: 172.20.0.11
    depends_on:
      bootstrap:
        condition: service_healthy
    environment:
      - SNG40_SEEDS=/ip4/172.20.0.10/tcp/4001/p2p/12D3KooWHp3texktugupqdqVQNfpwEmUmAsnLvFNTECLPcSYrE2Q
  node3:
